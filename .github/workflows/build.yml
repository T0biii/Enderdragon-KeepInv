name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
              echo "Tag '$GITHUB_REF_NAME' is not a valid version tag (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null)"; then
            # untagged build: SNAPSHOT of the most recent release tag
            echo "version=${last_tag#v}-SNAPSHOT" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin (Docker)
        run: docker build --target artifact --build-arg "VERSION=${{ steps.version.outputs.version }}" --output type=local,dest=dist .

      - name: List artifacts
        run: ls -l dist

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: EnderDragonKeepInv
          path: dist/*.jar
          if-no-files-found: error

  smoke-test:
    needs: build
    uses: ./.github/workflows/smoke-test.yml
    with:
      use-build-artifact: true

  release:
    if: github.ref_type == 'tag'
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q "select(.isDraft == false) | \"yes\"" 2>/dev/null || true)
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Download plugin jar
        if: steps.existing.outputs.published != 'yes'
        uses: actions/download-artifact@v8
        with:
          name: EnderDragonKeepInv
          path: dist

      - name: Create GitHub release
        if: steps.existing.outputs.published != 'yes'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Immutable releases require all assets to be attached before the release is published.
      - name: Publish release
        if: steps.existing.outputs.published != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
